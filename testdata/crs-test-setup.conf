# Test setup for the CRS regression tests.
#
# The CRS project writes its regression tests for this rule, which its
# README (coreruleset-4.30.0/tests/regression/README.md) says to add to
# crs-setup.conf. It is copied here unchanged except for one line:
# setvar:tx.blocking_paranoia_level=4 is left out, because the paranoia level
# is set by our configuration (testdata/crs-tests.json sets it to 4). With
# the line, the tests could not also be run at levels 1 to 3.
#
# This file is for testing only. The product configuration does not load it.

SecAction "id:900005,\
  phase:1,\
  nolog,\
  pass,\
  ctl:ruleEngine=DetectionOnly,\
  ctl:ruleRemoveById=910000,\
  setvar:tx.crs_validate_utf8_encoding=1,\
  setvar:tx.arg_name_length=100,\
  setvar:tx.arg_length=400,\
  setvar:tx.total_arg_length=64000,\
  setvar:tx.max_num_args=255,\
  setvar:tx.max_file_size=64100,\
  setvar:tx.combined_file_sizes=65535"
