# Own rules of the tests (docs/development-plan-own-rules.md), written the
# way the dashboard writes them: SecRule only, ids 1,000 to 99,999, a msg
# and a severity, and the severity's score added on the last rule of the
# chain. The tags application/NAME say which applications a rule is for,
# application/none the requests of no application; a rule without such a
# tag is for every request.

# Critical (5 points): an alert by itself. For the application shop only.
SecRule REQUEST_FILENAME "@beginsWith /admin" \
    "id:1000,\
    phase:1,\
    block,\
    msg:'Admin pages reached from outside the office',\
    severity:'CRITICAL',\
    tag:'paranoia-level/1',\
    tag:'application/shop',\
    chain"
    SecRule REMOTE_ADDR "!@ipMatch 10.0.0.0/8" \
        "setvar:'tx.inbound_anomaly_score_pl1=+%{tx.critical_anomaly_score}'"

# Warning (3 points): an alert only together with other points. For every
# request.
SecRule REQUEST_HEADERS:User-Agent "@contains evil-scanner" \
    "id:1001,\
    phase:1,\
    block,\
    t:lowercase,\
    msg:'A scanner the office has seen before',\
    severity:'WARNING',\
    tag:'paranoia-level/1',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.warning_anomaly_score}'"

# Error (4 points), in phase 2. For requests of no application only.
SecRule REQUEST_FILENAME "@streq /debug" \
    "id:1002,\
    phase:2,\
    block,\
    msg:'The debug page, on a host of no application',\
    severity:'ERROR',\
    tag:'paranoia-level/1',\
    tag:'application/none',\
    setvar:'tx.inbound_anomaly_score_pl1=+%{tx.error_anomaly_score}'"
