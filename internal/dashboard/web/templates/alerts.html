{{define "content"}}
<div class="pagehead">
  <h1>Alerts</h1>
  <div class="tools">{{template "period"}}{{template "live"}}</div>
</div>
<form class="filters" id="filters" autocomplete="off">
  <div class="field">
    <span class="field-label">Show</span>
    <div class="seg" role="group" aria-label="Show" id="kind">
      <button type="button" data-value="alerts">Alerts</button>
      <button type="button" data-value="all">All records</button>
      <button type="button" data-value="incomplete">Incomplete</button>
    </div>
  </div>
  <label>Rule <input name="rule" inputmode="numeric" pattern="[0-9]*" size="7"></label>
  <label>Attack group <select name="group" id="group"><option value="">Any</option></select></label>
  <label id="app-field" hidden>Application <select name="app" id="app"><option value="">Any</option></select></label>
  <label>Client IP <input name="ip" size="15"></label>
  <label>Location <input name="location" size="14" placeholder="ARGS:id"></label>
  <label>Min. score <input name="min_score" inputmode="numeric" pattern="[0-9]*" size="4"></label>
  <label>Order
    <select name="sort">
      <option value="time">Newest first</option>
      <option value="score">Highest score first</option>
    </select>
  </label>
</form>
<div class="active-filters" id="active" hidden></div>
{{template "notice"}}
<div id="fresh" class="fresh-bar" role="status" hidden></div>
<div id="view" class="stack"></div>
{{end}}
